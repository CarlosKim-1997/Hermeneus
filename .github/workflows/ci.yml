name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Record commit SHA
        run: echo "Commit SHA=${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: PR whitespace (git diff --check)
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"

      - name: Push whitespace (git diff --check)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: git diff --check "${{ github.event.before }}...${{ github.sha }}"

      - name: Install dependencies
        run: npm ci

      - name: Governance
        run: node tooling/governance/check.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit and deterministic suites
        run: |
          npm test
          npm run test:application
          npm run test:auth
          npm run test:share
          npm run test:receiver
          npm run test:receiver-semantic
          npm run test:receiver-answer
          npm run test:extraction

  postgres:
    name: postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hermeneus_test
          POSTGRES_PASSWORD: hermeneus_test
          POSTGRES_DB: hermeneus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hermeneus_test -d hermeneus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://hermeneus_test:hermeneus_test@localhost:5432/hermeneus_test
      TEST_DATABASE_URL: postgresql://hermeneus_test:hermeneus_test@localhost:5432/hermeneus_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run migrate

      - name: Integration tests
        run: npm run test:integration

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hermeneus_test
          POSTGRES_PASSWORD: hermeneus_test
          POSTGRES_DB: hermeneus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hermeneus_test -d hermeneus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://hermeneus_test:hermeneus_test@localhost:5432/hermeneus_test
      TEST_DATABASE_URL: postgresql://hermeneus_test:hermeneus_test@localhost:5432/hermeneus_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E
        run: npm run test:e2e

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install production dependencies only
        run: npm ci --omit=dev

      - name: Production dependency audit (critical threshold)
        run: |
          echo "Blocking gate: npm audit --omit=dev --audit-level=critical"
          npm audit --omit=dev --audit-level=critical
          echo "--- Full production audit (informational; HIGH/MODERATE may remain) ---"
          npm audit --omit=dev || true
