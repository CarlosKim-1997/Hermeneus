<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'none'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Hermeneus · Receiver 복구 흐름 시안</title>
<style>
:root{font-family:Inter,'Segoe UI','Malgun Gothic',sans-serif;color:#25362e;background:#f7f7f2;font-size:16px;line-height:1.7}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #b47b35;outline-offset:4px}button:disabled{cursor:not-allowed;opacity:.45}.sandbox{padding:14px 24px;background:#e9ede5;border-bottom:1px solid #d4dccf;font-size:13px}.sandbox strong{margin-right:12px}.scenarios{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.scenarios button{background:transparent;border:1px solid #bdc9b7;border-radius:20px;padding:4px 12px;font-size:12px}.scenarios button[aria-pressed=true]{background:#294c3a;color:white;border-color:#294c3a}header{max-width:1000px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:30px 28px}.brand{font-family:Georgia,serif;font-size:27px;letter-spacing:-1px}.tag{color:#657469;font-size:13px}main{max-width:760px;margin:22px auto 80px;padding:0 28px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:#6a795d;margin:0 0 12px}h1{font-size:clamp(27px,5vw,38px);line-height:1.35;font-weight:550;letter-spacing:-1.5px;margin:0 0 15px}p{margin:0 0 16px}.lead{color:#637168;max-width:590px}.steps{display:flex;gap:24px;padding:20px 0 28px;list-style:none;font-size:13px;color:#7d887d}.steps li.active{color:#294c3a;font-weight:700}.card{background:#fff;border:1px solid #dce2d7;border-radius:20px;padding:28px;margin-bottom:18px;box-shadow:0 8px 32px #273f2910}.document{border-left:3px solid #78945b;padding-left:18px;margin:18px 0 24px}.document strong{display:block;font-size:19px;font-weight:600}.meta{font-size:12px;color:#71816f;margin-top:6px}.notice{padding:16px 18px;background:#f1f3eb;border-radius:12px;color:#51634d;font-size:14px;margin:20px 0}.notice.warn{background:#fff5df;color:#765626}.check{display:flex;align-items:flex-start;gap:10px;font-size:14px;margin:22px 0}.check input{margin-top:7px;flex-shrink:0;accent-color:#31553f}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}button.primary{background:#294c3a;color:white;border:1px solid #294c3a}button.secondary{background:white;color:#294c3a;border:1px solid #c9d3c2}.actions button{border-radius:10px;padding:11px 19px;font-size:14px}.small{font-size:12px;color:#728071;margin-top:15px}.choice{display:flex;gap:12px;border:1px solid #dce2d7;border-radius:12px;padding:16px;margin:12px 0;cursor:pointer}.choice:has(input:checked){border-color:#547848;background:#f3f6ef}.choice input{accent-color:#31553f;flex-shrink:0}.choice b{display:block;font-size:15px}.choice span{font-size:12px;color:#6b7b68}blockquote{margin:18px 0;padding:18px;background:#f5f6f1;border-radius:12px;font-size:15px;white-space:pre-wrap}details{font-size:14px;margin:16px 0}summary{cursor:pointer}footer{font-size:12px;color:#7a8676;text-align:center;margin-top:28px}.state{display:inline-flex;gap:8px;align-items:center;background:#eaf1e4;padding:4px 11px;border-radius:16px;font-size:12px;color:#3f6035;margin-bottom:16px}.state.wait{background:#fff3da;color:#7a612e}h2{font-size:19px;margin:0 0 12px}.host{margin:20px 0;padding:18px;border:1px dashed #b7bfae;border-radius:12px;font-size:13px}.host button{margin-top:8px;padding:7px 12px;background:#eef1e9;border:1px solid #bdc9b7;border-radius:7px}.hidden{display:none}@media(max-width:480px){header{padding:22px}.tag{font-size:11px}main{padding:0 18px;margin-top:8px}.card{padding:20px}.steps{gap:14px;font-size:12px}.actions button{width:100%}.sandbox{padding:12px 18px}}
</style>
<div class="sandbox"><strong>합성 데이터 · 로컬 시안</strong>외부 연결·권한 발급·의미 검증을 실행하지 않습니다.
<nav class="scenarios" aria-label="화면 상태 미리보기"></nav></div>
<header><span class="brand">Hermeneus</span><span class="tag">맥락을 이어받는 공간</span></header>
<main><p class="eyebrow">A thoughtful handoff</p><h1 id="heading" tabindex="-1"></h1><p class="lead" id="intro"></p>
<ol class="steps"><li>01 전달본 확인</li><li>02 내 AI 연결</li><li>03 답변 확인</li></ol>
<section class="card" id="content" aria-labelledby="heading"></section>
<p role="status" aria-live="polite" id="status" class="small"></p>
<footer>필요한 맥락을, 나에게 맞는 속도로.</footer></main>
<script>
const states={ready:'전달본 확인',waiting:'연결 대기',choose:'공유 선택',connected:'연결 완료',expired:'권한 만료',unavailable:'접근 불가',review:'원문 확인',result:'검사 결과'};
const fixtures={a:{title:'웹 화면 초안 요청',summary:'금요일까지 웹 화면 초안을 준비해주세요. 모바일 담당자와 일정은 아직 정하지 않았습니다.',mark:'A · 41d2a7b803'},b:{title:'인쇄 시안 요청',summary:'화요일까지 보라색 인쇄 시안을 준비해주세요. 웹 화면 요청과는 별개의 전달본입니다.',mark:'B · 9c6f184e22'}};
let current='ready',selected='a';
const content=document.querySelector('#content'),nav=document.querySelector('.scenarios');
const doc=()=>`<div class="document"><strong>${fixtures[selected].title}</strong><p>${fixtures[selected].summary}</p><div class="meta">고정된 버전 1 · 합성 전달본 ${fixtures[selected].mark}</div></div>`;
const button=(id,label,primary=true,disabled=false)=>`<button id="${id}" class="${primary?'primary':'secondary'}" ${disabled?'disabled':''}>${label}</button>`;
const checkbox=(id,label)=>`<label class="check"><input id="${id}" type="checkbox"><span>${label}</span></label>`;
const bind=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=()=>{fn();};};
function render(next,focus=true){current=next;document.querySelector('#status').textContent='';
nav.innerHTML=Object.entries(states).map(([id,label])=>`<button data-state="${id}" aria-pressed="${id===next}">${label}</button>`).join('');
nav.querySelectorAll('button').forEach(b=>b.onclick=()=>render(b.dataset.state));
document.querySelectorAll('.steps li').forEach((el,i)=>el.classList.toggle('active',i===(['review','result'].includes(next)?2:next==='ready'?0:1)));
let title='',intro='',html='';
if(next==='ready'){title='이 맥락을 내 AI와 함께 읽어요';intro='먼저 전달받은 내용을 확인하세요. 이 공유 건을 선택한 뒤 AI 연결을 시작합니다.';html=doc()+`<div class="notice">선택한 전달본의 읽기와 선택 답변 검토만 허용합니다. 다른 공유 건에는 접근할 수 없습니다.</div>`+checkbox('consent','이 전달본을 내 AI에 연결하겠습니다.')+`<div class="actions">${button('start','연결 시작',true,true)}</div><p class="small">공유 권한은 최대 30분, AI 연결은 최대 60분입니다. 권한이 만료되면 다시 연결하고 승인해야 합니다.</p>`;}
if(next==='waiting'){title='AI 연결을 기다리고 있어요';intro='플러그인 화면을 연 것만으로 연결이 끝나지는 않습니다.';html=`<span class="state wait">연결 확인 전</span>`+doc()+`<p>연결 승인과 공유 건 선택을 마치면 다음 단계로 진행할 수 있습니다.</p><div class="host"><strong>시안의 시험 단계</strong><p>이미 연결된 ChatGPT에서 새 승인을 여는 방법은 실제 화면 확인 후 확정합니다.</p><button id="simulate">승인 화면으로 이동하는 상황 재현</button></div><div class="actions">${button('cancel','취소하고 전달본으로',false)}</div>`;}
if(next==='choose'){title='어떤 전달본을 연결할까요?';intro='열어둔 공유 건이 여러 개입니다. 이번 대화에서 사용할 하나를 직접 선택하세요.';html=Object.entries(fixtures).map(([id,f])=>`<label class="choice"><input type="radio" name="share" value="${id}"><div><b>${f.title}</b><p>${f.summary}</p><span>버전 1 · 합성 전달본 ${f.mark}</span></div></label>`).join('')+`<p class="small">연결 대상: 합성 연결 1 · 실제 ChatGPT 계정 선택을 나타내지 않습니다.</p><div class="actions">${button('approve','선택한 전달본 승인',true,true)}${button('cancel','취소',false)}</div>`;}
if(next==='connected'){title='선택한 전달본이 준비됐어요';intro='새 대화에서 내 AI와 내용을 살펴보고, 확인할 답변만 위젯으로 보내세요.';html=`<span class="state">연결 완료 상황 시안</span>`+doc()+`<div class="notice">이 연결은 지금 선택한 전달본에만 적용됩니다. 다른 공유 건은 별도로 승인해야 합니다.</div><div class="actions">${button('answer','답변이 돌아온 화면 보기')}${button('expire','만료 상황 보기',false)}</div><p class="small">시안에서는 새 Chat을 열거나 실제 연결을 만들지 않습니다.</p>`;}
if(next==='expired'){title='AI 접근 시간이 끝났어요';intro='계속 읽으려면 원래 공유 링크에서 연결과 승인을 다시 진행해주세요.';html=`<span class="state wait">재연결 필요</span><p>보낸 사람이 준 원래 공유 링크는 별도로 유효할 수 있습니다. 이전 AI 연결의 권한은 자동으로 이어지지 않습니다.</p><div class="actions">${button('restart','원래 링크를 다시 연 상황 보기')}</div><p class="small">실제 복구에서는 원래 공유 링크가 필요합니다. 이 시안은 합성 전달본을 처음부터 다시 보여줍니다.</p>`;}
if(next==='unavailable'){title='이 공유 건을 열 수 없어요';intro='보낸 사람에게 사용 가능한 공유 링크를 요청해주세요.';html=`<p>현재 접근 가능 여부를 확인할 수 없습니다. 삭제·철회 여부를 이 화면에서 단정하지 않습니다.</p><div class="actions">${button('restart','다른 링크를 받은 상황 보기',false)}</div>`;}
if(next==='review'){title='내가 선택한 답변이 맞나요?';intro='위젯은 대화 전체를 읽거나 원래 답변과 자동으로 비교하지 않습니다.';html=doc()+`<div class="notice warn"><strong>의미 검증 제공자 미연결</strong><br>이번 시안의 검사는 구조와 버전만 확인합니다. Canon과 의미가 일치하는지는 판정하지 않습니다.</div><blockquote>${selected==='a'?'금요일까지 웹 화면 초안을 준비합니다. [HI-001]\n모바일 담당자와 일정은 아직 미정입니다. [HI-002]':'화요일까지 보라색 인쇄 시안을 준비합니다. [HI-001]'}</blockquote><details><summary>기준 Canon 확인</summary><p>${fixtures[selected].summary}</p></details>`+checkbox('original','표시된 답변이 내가 선택한 원문임을 확인했습니다.')+`<div class="actions">${button('inspect','확인한 원문 검사',true,true)}</div><p class="small">Hermeneus에 답변과 확인 여부를 영속 저장하지 않습니다. ChatGPT의 보존은 별도입니다.</p>`;}
if(next==='result'){title='구조 확인을 마쳤어요';intro='의미의 일치 여부는 아직 판단되지 않았습니다.';html=`<div class="notice warn"><strong>INDETERMINATE · 의미 검증 미실행</strong><br>합성 결과: 구조·고정 버전 확인 완료. 의미 검증 제공자가 연결되지 않아 Canon 정합성은 판정하지 않았습니다.</div><p>다른 답변을 검사하려면 새로 가져온 원문을 다시 확인해야 합니다.</p><div class="actions">${button('again','다른 답변 확인',false)}</div>`;}
document.querySelector('#heading').textContent=title;document.querySelector('#intro').textContent=intro;content.innerHTML=html;
bind('consent',()=>document.querySelector('#start').disabled=!document.querySelector('#consent').checked);bind('start',()=>render('waiting'));bind('simulate',()=>render('choose'));bind('cancel',()=>render('ready'));
content.querySelectorAll('[name=share]').forEach(el=>el.onchange=()=>document.querySelector('#approve').disabled=false);
bind('approve',()=>{const choice=content.querySelector('[name=share]:checked');if(!choice)return;selected=choice.value;render('connected');});
bind('answer',()=>render('review'));bind('expire',()=>render('expired'));bind('restart',()=>{selected='a';render('ready');});
bind('original',()=>document.querySelector('#inspect').disabled=!document.querySelector('#original').checked);bind('inspect',()=>render('result'));bind('again',()=>render('review'));
if(focus)document.querySelector('#heading').focus();}
render('ready',false);
</script>
</html>
